name: promote-main-to-develop

# After sync-upstream updates origin/main with upstream changes, promote those changes
# into origin/develop. Fast-forward if possible; otherwise open / update a PR.
# Cleanly no-ops when develop already contains all of main (the steady-state).
# See docs/FORK_WORKFLOW.md.

on:
  workflow_run:
    workflows: ['sync-upstream']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-main-to-develop
  cancel-in-progress: false

jobs:
  promote:
    # Only run if the chained sync-upstream run was successful (or if dispatched manually)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop with full history
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity for the bot
        run: |
          git config user.name 'flexnetos-sync-bot'
          git config user.email 'flexnetos-sync-bot@users.noreply.github.com'

      - name: Fetch origin/main
        run: git fetch origin main

      - name: Decide promotion strategy
        id: strategy
        run: |
          main_sha="$(git rev-parse origin/main)"
          dev_sha="$(git rev-parse HEAD)"
          echo "main_sha=$main_sha"   >> "$GITHUB_OUTPUT"
          echo "dev_sha=$dev_sha"     >> "$GITHUB_OUTPUT"

          # Case 1: develop and main point at the same commit
          if [ "$main_sha" = "$dev_sha" ]; then
            echo 'develop already equals origin/main — nothing to promote.'
            echo "action=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Case 2: main is an ancestor of develop (develop already contains all of main).
          # Steady-state once we have any feature commits on develop. No promotion needed.
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'develop already contains all of origin/main — nothing to promote.'
            echo "action=noop" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Case 3: develop is an ancestor of main (main is strictly ahead of develop with
          # no divergence). Fast-forward is safe.
          if git merge-base --is-ancestor HEAD origin/main; then
            echo 'develop is ancestor of origin/main — fast-forward is safe.'
            echo "action=ff" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Case 4: actual divergence — need a PR
          echo 'develop has diverged from main — opening sync PR.'
          echo "action=pr" >> "$GITHUB_OUTPUT"

      - name: Fast-forward develop to origin/main
        if: steps.strategy.outputs.action == 'ff'
        run: |
          git merge --ff-only origin/main
          git push origin develop

      - name: Prepare and push sync branch
        if: steps.strategy.outputs.action == 'pr'
        id: prep
        run: |
          # Stable branch name so re-runs update the same PR rather than spawning duplicates
          sync_branch='chore/sync-upstream-into-develop'
          echo "sync_branch=$sync_branch" >> "$GITHUB_OUTPUT"

          # Start fresh from develop (delete any stale remote sync branch first)
          git push origin --delete "$sync_branch" 2>/dev/null || true
          git checkout -B "$sync_branch" develop

          if git merge --no-edit --no-ff origin/main; then
            echo 'merge_clean=true' >> "$GITHUB_OUTPUT"
          else
            echo 'merge_clean=false' >> "$GITHUB_OUTPUT"
            # Leave conflict markers in the tree so the PR is reviewable
            git add -A
            git commit -m 'chore: sync upstream into develop (CONFLICTS — needs human resolution)'
          fi

          git push origin "$sync_branch"

      - name: Open or update sync PR
        if: steps.strategy.outputs.action == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sync_branch='${{ steps.prep.outputs.sync_branch }}'
          existing=$(gh pr list --head "$sync_branch" --base develop --state open --json number --jq '.[0].number // empty')
          body="Automated promotion of \`origin/main\` (mirrors \`iOfficeAI/AionUi:main\`) into develop.

          - main SHA: \`${{ steps.strategy.outputs.main_sha }}\`
          - develop SHA before sync: \`${{ steps.strategy.outputs.dev_sha }}\`
          - Merge clean: \`${{ steps.prep.outputs.merge_clean }}\`

          If \`merge_clean = false\`, this PR contains conflict markers — resolve them and push back to the same branch (\`$sync_branch\`), or close this PR and rebase manually."

          if [ -n "$existing" ]; then
            echo "PR #$existing already open — refreshing comment"
            gh pr comment "$existing" --body "Updated by promote run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}): main SHA \`${{ steps.strategy.outputs.main_sha }}\`, merge_clean=\`${{ steps.prep.outputs.merge_clean }}\`."
          else
            gh pr create \
              --base develop \
              --head "$sync_branch" \
              --title 'chore: sync upstream into develop' \
              --body "$body" \
              --label sync \
              --label chore
          fi
